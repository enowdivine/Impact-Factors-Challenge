<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bliss Dating</title>
    <style>
        body {
            width: 100%;
            margin: 0;
            padding: 0;
            background: #f1effe !important;
        }

        .container {
            width: 100%;
            background: #f1effe !important;
            padding: 30px 0;
        }

        .brand-container {
            text-align: left;
            align-items: left;
            margin: 30px 0 0 100px;
        }

        .brand-title {
            color: #2a3f55;
            font-size: 28.4px;
            font-family: Lunema;
            font-weight: 900;
            word-wrap: break-word;
        }

        .brand-title-color {
            color: #10C0BA;
        }

        .brand-subtitle {
            justify-content: center;
            align-items: center;
            gap: 8.28px;
            display: inline-flex;
        }

        .subtitle-text-wrapper {
            margin-left: 10px;
        }

        .subtitle-text {
            text-align: center;
            color: #2a3e55;
            font-family: Nunito Sans;
            font-weight: 600;
            word-wrap: break-word;
        }

        .logo-container {
            text-align: center;
            margin-top: 30px;
        }

        /* .logo-container img {
            border-radius: 50%;
        } */

        .email-title {
            width: 100%;
            text-align: center;
            margin: 20px 0;
        }

        .email-title p {
            width: 80%;
            font-size: 20px;
            margin: auto;
        }

        .email-content-container {
            width: 80%;
            margin: auto;
            min-height: 100px;
            background: white;
            justify-content: center;
            /* overflow: hidden; */
            border-radius: 5px;
            padding: 20px;
        }

        .social-media-container {
            margin: 30px 0;
        }

        .social-media-icons {
            display: flex;
            justify-content: center;
            text-align: center;
        }

        .social-media-icons-inner-div {
            width: 60%;
            margin: auto;
        }

        .social-media-icons img {
            width: 60px;
            height: 60px;
        }

        .footer-text {
            text-align: center;
            color: #171725;
            font-size: 24px;
            font-family: Lunema;
            font-weight: 400;
            word-wrap: break-word;
        }

        .footer-text-bold {
            text-align: center;
            color: #171725;
            font-size: 24px;
            font-family: Lunema;
            font-weight: 700;
            /* word-wrap: break-word; */
        }

        .footer-description {
            text-align: center;
            color: #171725;
            font-size: 20px;
            font-family: Lunema;
            font-weight: 400;
            word-wrap: break-word;
            margin: 10px 0;
        }

        .footer-description a {
            color: #10C0BA;
        }

        .username {
            font-weight: bold;
        }

        .action_btn_div {
            margin: 50px 0;
        }

        .action_btn {
            background-color: #10C0BA;
            color: white !important;
            border: none;
            border-radius: 30px;
            padding: 20px 60px;
            font-weight: bold;
            text-decoration: none;
        }

        /* Welcome email content styles */
        .email-content {
            text-align: center;
            width: 70%;
            margin: 40px auto;
            font-size: 18px;
        }

        .email-content .links {
            color: #10C0BA;
            text-decoration: none;
        }

        .email-content .activation-code {
            margin: 40px 0;
        }

        .email-content .activation-code span {
            border: 1px dotted #10C0BA;
            border-radius: 30px;
            padding: 10px 35px;
            color: #10C0BA;
            letter-spacing: 5px;
        }

        .expert-welcome-mail {
            /* text-align: center; */
            width: 80%;
            margin: 40px auto;
            font-size: 18px;
        }

        /* Extra small devices (phones, 600px and down) */
        @media only screen and (max-width: 600px) {
            .brand-container {
                margin: 10px 0 0 10px;
            }

            .email-content-container {
                width: 90%;
            }

            .email-content {
                width: 98%;
            }

            .expert-welcome-mail {
                width: 100%;
            }

            .social-media-icons-inner-div {
                width: 100%;
                margin: auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="brand-container">
            <div class="brand-title">
                <span class="brand-title-color">Bliss</span> Dating
            </div>
            <div class="brand-subtitle">
                <span class="subtitle-text">By</span>
                <span class="subtitle-text-wrapper"><span class="subtitle-text">BLISS</span></span>
            </div>
        </div>
        <div class="logo-container">

            <a style="width: 100%" href="https://placehold.co/400">
                <img style="width: 10%; border-radius: 50%;" src="https://placehold.co/200" />
            </a>
            <div class="email-title">
                <p>
                    <!-- Dear Tony <span class="username">Stark</span>, welcome to
                <span class="brand-title-color">Campus</span> camer -->
                    ${emailTitle}
                </p>
            </div>
            <div class="email-content-container">
                <!-- Email Content Goes Here -->
                <div class="expert-welcome-mail">
                    <!-- <h3>Before Starting your adventure</h3>
                <div>
                    Lorem ipsum dolor sit amet consectetur, adipisicing elit. Libero et ipsam consequatur voluptate
                    adipisci sint illo excepturi, eos perferendis quibusdam voluptas odit impedit fugiat, obcaecati
                    fugit deleniti ab temporibus consectetur?
                </div> -->
                    ${emailContent}
                </div>
            </div>
            <div class="social-media-container">
                <div class="social-media-icons">
                    <div class="social-media-icons-inner-div">
                        <a href="#" target="_blank">
                            <img src="https://lh3.googleusercontent.com/pw/AP1GczNFVtSTjrRY7vY0r_QpEMb76cq_yUgDBn70xmubXnIz39nqZ3d5Jf0WG-Rn6XrFNOm-cnK-PwuM3ffhcfvsfYvW27xtEredLoqr-cbsuDmBIorvAA=s256-p-k"
                                alt="Facebook" />
                        </a>
                        <a href="#" target="_blank">
                            <img src="https://lh3.googleusercontent.com/pw/AP1GczOS1Gd4yuFD2KL8nbJaVSULVP_n-XS7cgSPa-WuD7c5FS8_eZmZXy-s8i2ltUo09XTqEMasC6aUIpoKgNzf7Tc_c89YYy1OcJq1C7FFn5jS4HKenw=w2400"
                                alt="Twitter" />
                        </a>
                        <a href="#" target="_blank">
                            <img src="https://lh3.googleusercontent.com/pw/AP1GczN3puuGx6amhwedFbo7tEypZhUnvOlBKeniiwoHuDObYvTAMePK_xkKwbt7FRNhSP4DXfSBQox39wZzj_6E9GMOuPtKZ4zamx12KajfRGojt2hIjQ=w2400"
                                alt="LinkedIn" />
                        </a>
                        <!-- <img src="https://via.placeholder.com/90" alt="Instagram" /> -->
                        <!-- Add more social media icons as needed -->
                    </div>
                </div>
                <div class="footer-text">
                    <div class="footer-description">Copyright &copy; 2024 | <a href="#" target="_blank">Visit
                            Website</a></div>
                    <div class="footer-text-bold">Bliss Dating</div>
                    <!-- <div class="footer-description">Campus Camer by AECO</div> -->
                </div>
            </div>
        </div>
</body>

</html>
